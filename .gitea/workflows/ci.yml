name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    container: catthehacker/ubuntu:act-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install ruff
          .venv/bin/pip install -r requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint with ruff (inkl. Security-Regeln)
        run: ruff check . --select E,F,W,S,B

      - name: Compile sources
        run: python -m compileall pfsense_backup.py

  build-and-push:
    name: Build & Push
    # Runs only when every check job passed.
    needs: [lint]
    # Fail instead of blocking the runner when an emulated build hangs.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    # Job containers have no Docker socket of their own, so the build talks to
    # a Docker-in-Docker service.
    services:
      dind:
        image: docker:27-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        options: >-
          --privileged
          --health-cmd "docker info"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DOCKER_HOST: tcp://dind:2375
      # Only the boolean reaches the environment, never the secret itself.
      HAS_REGISTRY_TOKEN: ${{ secrets.PACKAGES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the Docker daemon
        run: |
          for i in $(seq 1 30); do
            docker info >/dev/null 2>&1 && break
            echo "waiting for the dind daemon... ($i)"
            sleep 2
          done
          docker info

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          # binfmt:latest ships QEMU 10, under which Node crashes with
          # "Illegal instruction" in the arm64 build and the job hangs.
          image: tonistiigi/binfmt:qemu-v9.2.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # network=host: BuildKit uses the network namespace of the dind
          # container, so RUN steps can resolve DNS.
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host

      - name: Resolve the image reference
        id: image
        env:
          # Read here, not in a workflow-level env block: this Gitea does not
          # expand the vars context there.
          RAW_REGISTRY: ${{ vars.REGISTRY_GITEA || 'gitea.groot.rocks' }}
        run: |
          # Strip whitespace: a variable set in the web UI may end in a newline.
          registry=$(printf '%s' "$RAW_REGISTRY" | tr -d '[:space:]')
          # Registry paths must be lower case, repository owners need not be.
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "reference=$registry/$repository" >> "$GITHUB_OUTPUT"
          echo "Image reference: $registry/$repository"

      - name: Log in to the Gitea container registry
        if: github.event_name != 'pull_request' && env.HAS_REGISTRY_TOKEN == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ secrets.GITEA_USERNAME || github.actor }}
          password: ${{ secrets.PACKAGES_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.reference }}
          # "latest" only from the raw rule below, never automatically.
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=pfSense-backup-python
          tags: |
            # Every pushed build: the commit, e.g. sha-1a2b3c4.
            type=sha,prefix=sha-,format=short
            # Release tag vX.Y.Z: the version X.Y.Z (also for prereleases).
            type=semver,pattern={{version}}
            # "latest" only for a release tag vX.Y.Z, not for a prerelease.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && env.HAS_REGISTRY_TOKEN == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          network: host
          allow: network.host

      - name: Build summary
        if: always()
        run: |
          {
            echo "### Build summary"
            echo "Image: ${{ steps.image.outputs.reference }}"
            echo "Platforms: linux/amd64,linux/arm64"
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Push: skipped for pull requests"
            elif [ "${{ env.HAS_REGISTRY_TOKEN }}" != "true" ]; then
              echo "Push: skipped, the PACKAGES_TOKEN secret is not set"
            else
              echo "Push: yes"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
